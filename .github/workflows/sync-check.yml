name: sync-check

# 上游漂移检查（只读：dry-run，不改主干）。人工触发完整同步（docs/06 §7）。
on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dry-run sync (all upstreams)
        run: |
          cargo run --bin drawio-sync -- run --all --dry-run --json | tee sync-dryrun.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sync-dryrun
          path: sync-dryrun.json

      - name: Fail on L2 drift (提示资产过期)
        run: |
          # L1/L3 漂移仅记录不失败；L2（提示词/资产）漂移提示尽快同步
          python3 - <<'EOF'
          import json, sys
          rep = json.load(open("sync-dryrun.json"))
          drifted = [u["id"] for u in rep.get("upstreams", []) if u.get("l2_changed")]
          if drifted:
              print(f"::warning::L2 asset drift on: {', '.join(drifted)} — run drawio-sync")
          print("upstreams:", [u["id"] for u in rep.get("upstreams", [])])
          EOF
