name: release

# 打 tag 发布：推送 `v0.1.0` 这类标签即构建三平台安装包并创建 Release。
# tag 名需与 src-tauri/tauri.conf.json 的 version 一致（tagName 由 __VERSION__ 占位）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            build-essential curl wget file

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 包需要两个 macOS target，其他平台留空
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "drawio-rust v__VERSION__"
          releaseBody: |
            安装包：macOS (.dmg，通用) / Windows (.msi, .exe) / Linux (.deb, .rpm, .AppImage)。

            未做代码签名，首次运行可能被 Gatekeeper / SmartScreen 拦截。
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
